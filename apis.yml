aid: pixie-labs
name: Pixie Labs
description: >-
  Pixie Labs built Pixie, an open-source, Kubernetes-native application
  observability and debugging platform that uses dynamic eBPF probes to
  auto-instrument workloads and capture metrics, events, full-body traces, and
  logs in seconds without code changes. Data is collected and queried in-cluster
  via PxL scripts, avoiding costly telemetry export. Pixie Labs was acquired by
  New Relic in December 2020; the project was contributed to the Cloud Native
  Computing Foundation (CNCF) as a sandbox project and is developed in the open
  at px.dev under the pixie-io GitHub organization. Pixie exposes a gRPC API
  (Pixie Cloud for cluster discovery/management and Pixie Vizier for PxL script
  execution) with first-party Go and Python client libraries and the px CLI.
